<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mashu</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-review" aria-selected="true">Review <span id="review-count"></span></button>
      <button type="button" role="tab" id="tab-tasks" aria-selected="false">Tasks <span id="task-count"></span></button>
    </nav>
    <label class="toggle" id="deferred-toggle"><input type="checkbox" id="include-deferred"> include deferred</label>
    <button type="button" id="refresh">Check now</button>
  </header>
  <p id="message" role="status" hidden></p>

  <main id="review-pane">
    <aside aria-label="candidates">
      <ul id="queue" class="list"></ul>
      <p id="empty" class="muted" hidden>Nothing waiting for review.</p>
    </aside>
    <article id="detail" hidden>
      <p id="meta" class="muted"></p>
      <p id="deferred-note" class="warn" hidden></p>
      <div id="content" class="body"></div>
      <form id="edit-form" hidden>
        <textarea id="edit-text" rows="6"></textarea>
        <div class="row">
          <button type="submit">Save wording</button>
          <button type="button" id="edit-cancel">Cancel</button>
          <span class="muted">Saving keeps it pending; admit afterwards.</span>
        </div>
      </form>
      <section id="conflicts" hidden>
        <h3>Retired conflicts</h3>
        <ul id="conflict-list"></ul>
        <label><input type="checkbox" id="conflicts-read"> I have read why these were retired</label>
      </section>
      <section>
        <h3>Evidence</h3>
        <ul id="evidence-list"></ul>
      </section>
      <section class="actions">
        <div class="row">
          <label>delivery
            <select id="delivery">
              <option value="always">always — every session, at start</option>
              <option value="scope">scope — sessions in its Scope, at start</option>
              <option value="topic">topic — read when its trigger's work begins</option>
            </select>
          </label>
          <select id="topic" hidden></select>
          <button type="button" id="admit" class="primary">Admit</button>
          <button type="button" id="edit">Edit wording</button>
        </div>
        <div class="row">
          <input id="reason" type="text" placeholder="why turn it down or put it off">
          <button type="button" id="decline" class="danger">Turn down</button>
          <button type="button" id="defer">Put off</button>
        </div>
      </section>
    </article>
  </main>

  <main id="tasks-pane" hidden>
    <aside aria-label="open tasks">
      <ul id="task-list" class="list"></ul>
      <p id="no-tasks" class="muted" hidden>No open tasks.</p>
    </aside>
    <article id="task-detail" hidden>
      <h2 id="task-name"></h2>
      <p id="task-meta" class="muted"></p>
      <section id="proposal" class="proposal" hidden>
        <p id="proposal-said"></p>
        <p id="proposal-reason"></p>
        <p id="proposal-stale" class="warn" hidden></p>
        <div class="row">
          <label id="stale-confirm" hidden><input type="checkbox" id="stale-ok"> close on it anyway</label>
          <button type="button" id="accept" class="primary">Accept proposal</button>
          <button type="button" id="keep">Keep open (drop proposal)</button>
        </div>
      </section>
      <dl id="state"></dl>
      <section class="actions">
        <h3>Decide yourself</h3>
        <div class="row">
          <select id="outcome"></select>
          <input id="close-reason" type="text" placeholder="reason (may be empty)">
          <button type="button" id="close" class="danger">Close</button>
        </div>
        <div class="row">
          <button type="button" id="renew">Renew lease</button>
          <span class="muted">Says the work is still current; decides nothing about whether it is finished.</span>
        </div>
      </section>
    </article>
  </main>
</body>
</html>
