[package]
name = "mashu-desktop"
version = "4.0.0"
description = "Tray app for deciding what Mashu keeps"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Always serve the pages in ui/ from inside the binary; there is no dev server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
