[project]
name = "mashu"
# The one version is __version__ in src/mashu/__init__.py, which mashu --version reads directly,
# so an editable install reports a bump without being reinstalled.
dynamic = ["version"]
description = "Shared agent knowledge state that keeps only what forgetting has provably cost"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
mashu = "mashu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mashu/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mashu"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
