name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes the older run moot, but every commit on main keeps its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A tag names a commit main's run has already checked, so a tag runs only the release job.
  lint:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only full version tags, with no moving v10 tag to follow.
      - uses: astral-sh/setup-uv@v10.2.0

      - run: uv sync --locked

      - run: uv run ruff check

      - run: uv run ruff format --check

      - run: bash -n tools/release.sh

  test:
    if: github.ref_type != 'tag'
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    # Service containers run only on Linux runners, and an empty image leaves the service out.
    # Windows runners come with PostgreSQL installed, and the step below starts it.
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-latest' && 'postgres:17' || '' }}
        env:
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # The tests connect with bare dbname= strings, so libpq takes the rest from these.
    # root is the password the Windows runner image gives the postgres user.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: root
    steps:
      # The image ships the service disabled, and a disabled service refuses to start.
      - name: Start PostgreSQL
        if: runner.os == 'Windows'
        run: |
          Get-Service -Name 'postgresql*' |
            Set-Service -StartupType Manual -PassThru |
            Start-Service -PassThru

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}

      # Tests that need the MCP server call importorskip, so without the extra they skip instead of failing.
      - run: uv sync --locked --extra mcp

      - run: uv run pytest -q -rs

  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      id: ${{ steps.draft.outputs.id }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      # The full history, so the tagged commit can be looked for on main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A release names the version the package reports, and only a commit main's run passed.
      - name: Check the version tag
        run: |
          found="$(sed -n -E 's/^__version__ = "([^"]*)"$/\1/p' src/mashu/__init__.py)"
          if [[ "v$found" != "$TAG" ]]; then
            echo "::error::Tag $TAG does not match __version__ $found in src/mashu/__init__.py. Commit the version to main and tag that commit."
            exit 1
          fi
          sha="$(git rev-parse 'HEAD^{commit}')"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::Tag $TAG is on ${sha::12}, which is not on main. Tag a commit that main has."
            exit 1
          fi
          passed="$(gh run list --workflow CI --commit "$sha" --branch main --status success --json databaseId --jq length)"
          if [[ "$passed" == "0" ]]; then
            echo "::error::No passing CI run on main for ${sha::12}. Tag the commit after main's run has passed."
            exit 1
          fi

      # A draft until both apps are on it, so the latest release always carries its latest.json.
      - name: Draft the release
        id: draft
        run: |
          if [[ "${TAG#v}" =~ [a-z] ]]; then
            kind=(--prerelease)
          else
            kind=()
          fi
          gh release create "$TAG" --verify-tag --draft "${kind[@]}" --title "mashu $TAG" --generate-notes
          echo "id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  desktop:
    if: github.ref_type == 'tag'
    needs: release
    name: desktop (${{ matrix.os }})
    strategy:
      # One at a time, since each build adds its platform to the same latest.json.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            bundles: app
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # The app reports the release's version; semver writes the PEP 440 prerelease 4.1.0b1 as 4.1.0-b1.
      - name: Version the app from the tag
        shell: bash
        run: |
          semver="$(sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)((a|b|rc)[0-9]+)$/\1-\2/' <<< "${TAG#v}")"
          node -e 'const fs = require("fs"); const path = "desktop/src-tauri/tauri.conf.json"; const conf = JSON.parse(fs.readFileSync(path, "utf8")); conf.version = process.argv.at(-1); fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");' "$semver"

      # The updater checks each download against the public key in tauri.conf.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: npx --yes @tauri-apps/cli@2.12.4
          releaseId: ${{ needs.release.outputs.id }}
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}

  publish:
    if: github.ref_type == 'tag'
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      # PEP 440 marks a prerelease with a letter (a, b or rc) after the release numbers.
      - name: Publish the release
        run: |
          if [[ "${TAG#v}" =~ [a-z] ]]; then
            kind=(--prerelease --latest=false)
          else
            kind=(--latest)
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${kind[@]}"
